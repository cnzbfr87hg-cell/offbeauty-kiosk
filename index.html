const content = document.querySelector("#content");
const footer = document.querySelector("#footer");
const reader = document.querySelector("#reader");
const seasonControl = document.querySelector("#season");
const state = {page:"home", category:0, sku:null, origin:"home", returnTo:"home", sale:null};
const money = price => price.toLocaleString("ko-KR")+"원";
const button = (label, action, cls="primary") => '<button class="'+cls+'" data-action="'+action+'">'+label+'</button>';
const art = (id, large=false) => '<div class="art '+id+(large?' large':'')+'" aria-hidden="true"><i class="pack">OFF<br>BEAUTY</i>'+(large?'<span class="size">'+products[id].size+'</span>':'')+'</div>';
const steps = stage => '<div class="steps">'+["상품 선택","결제","수령"].map((v,i)=>i===stage?"<b>"+v+"</b>":v).join(" → ")+'</div>';
const back = action => button("‹ 이전",action,"back");
function season(){
  const month = Number(new Intl.DateTimeFormat("en",{month:"numeric",timeZone:"Asia/Seoul"}).format(new Date()));
  const fallback = month < 3 || month === 12 ? "winter" : month < 6 ? "spring" : month < 9 ? "summer" : "autumn";
  return seasons[seasonControl.value === "auto" ? fallback : seasonControl.value];
}
function home(){
  const current = season();
  const p = products[current.pick];
  return '<section class="hero"><i class="orb" aria-hidden="true"></i><small>'+current.name+'</small><h2>'+current.title+'</h2></section>'+
    '<h2 class="section-title">지금 어떤 뷰티가 필요해요?</h2><div class="grid">'+categories.map((c,i)=>'<button class="tile" data-action="category:'+i+'"><span class="symbol" aria-hidden="true">'+c.symbol+'</span><span>'+c.name+'<span class="go" aria-hidden="true">›</span></span></button>').join("")+'</div>'+
    '<h2 class="section-title">계절 추천 상품</h2><button class="pick" data-action="product:'+current.pick+'">'+art(current.pick)+'<span><strong>'+p.name+'</strong><small>'+p.volume+' · '+(current.pick==="sun"?"외출 전 선케어":current.pick==="lip"?"입술 보습":current.pick==="paper"?"외출 중 유분 관리":"손 보습")+'</small></span><em>'+money(p.price)+'</em></button>';
}
function catalog(){
  const c=categories[state.category];
  return back("home")+steps(0)+'<h3>'+c.name+'</h3><div class="list">'+c.items.map(id=>{
    const p=products[id];
    return '<button class="item" data-action="product:'+id+'">'+art(id)+'<span><strong>'+p.name+'</strong><small>'+p.volume+' · '+p.use+'</small><b>'+money(p.price)+'</b></span></button>';
  }).join("")+'</div>';
}
function detail(){
  const p=products[state.sku];
  return back(state.origin)+steps(0)+'<h3>'+p.name+'</h3><p class="copy">'+p.volume+' · '+p.use+'</p>'+art(state.sku,true)+'<p class="note">패키지와 크기는 예시입니다. 실물은 자판기 진열창에서 확인하세요.</p><strong class="price">'+money(p.price)+'</strong>'+button(money(p.price)+" 결제하기","checkout");
}
function checkout(){
  const p=products[state.sku];
  return back("detail")+steps(1)+'<h3>아래 단말기에<br>카드를 태그해 주세요</h3><div class="panel"><strong>'+p.name+' · 1개</strong><span class="price">'+money(p.price)+'</span></div><p class="copy">화면 아래 카드 단말기를 누르면 결제와 배출을 시연할 수 있어요.</p>'+button("카드 결제 시연","pay")+button("미배출 상황 시연","fail","secondary")+button("결제 취소","detail","secondary");
}
function receipt(){
  const sold=state.sale;
  const p=products[sold.sku];
  return steps(2)+'<div class="status" aria-hidden="true">'+(sold.failed?"!":"✓")+'</div><h3>'+(sold.failed?"상품이 나오지 않았어요":"하단 수령구에서<br>상품을 꺼내 주세요")+'</h3><div class="panel"><strong>'+p.name+' · '+money(p.price)+'</strong><p class="meta">시연 거래번호 '+sold.id+'</p></div>'+(sold.failed?button("미배출 안내","issue:missing"):button("수령 완료","home"))+(sold.failed?"":button("상품이 나오지 않았어요","issue:missing","secondary"));
}
function storeView(){
  return '<h3>가까운 매장 안내</h3><div class="panel"><strong>오프뷰티 성수메가팩토리점</strong><p class="meta">서울 성동구 연무장3길 9<br>공개 운영 안내 · 매일 10:00–22:00</p><p class="route"><b>도보 경로</b><br>성수역 4번 출구 → 연무장3길 9<br>출구부터의 경로를 휴대폰으로 열 수 있어요.</p><img class="qr" src="'+qr+'" alt="성수역 4번 출구에서 오프뷰티 성수점까지의 도보 길찾기 QR"><a class="secondary" target="_blank" rel="noopener" href="'+route.replaceAll("&","&amp;")+'">지도에서 도보 경로 열기 ↗</a></div><div class="panel"><strong>매장에서 더 둘러보기</strong><p class="copy">미니 스킨케어 · 핸드케어 · 마스크팩</p>'+button("방문 혜택 확인","benefit","secondary")+'</div>';
}
function help(){
  return back("return")+'<h3>무엇을 도와드릴까요?</h3>'+button("결제했는데 상품이 나오지 않아요","issue:missing","secondary")+button("금액이 다르거나 중복 결제됐어요","issue:payment","secondary")+'<p class="note">기기 식별번호 · SEONGSU-DEMO-01</p>';
}
function issue(){
  const missing=state.page==="missing";
  return back("help")+'<h3>'+(missing?"상품 미배출":"오결제·중복 결제")+'</h3><p class="copy">'+(missing?"하단 수령구를 한 번 확인해 주세요. 상품이 없다면 다시 결제하기 전에 운영 담당자에게 문의해 주세요.":"다시 결제하기 전에 카드 승인 내역에서 금액과 결제 시간을 확인해 주세요.")+'</p><div class="panel"><strong>문의에 필요한 정보</strong><p class="meta">기기 번호 SEONGSU-DEMO-01<br>거래번호 '+(state.sale?.id || "영수증 또는 카드 승인 내역 확인")+'<br>결제 시각 · 상품명 · 결제 금액</p></div><p class="note">실운영 시 자판기 본체의 고객지원 연락처로 접수합니다. 이 시연에서는 실제 접수가 진행되지 않습니다.</p>'+button("도움말로 돌아가기","help","secondary");
}
function benefit(){
  return back("store")+'<h3>매장 방문 혜택</h3><div class="panel"><strong>방문자 대상 미니 뷰티 큐레이션</strong><p class="copy">매장 직원에게 자판기에서 왔다고 말씀해 주세요. 휴대용 뷰티 상품 코너를 안내받는 방문 혜택 예시입니다.</p><p class="note">자판기 구매 여부와 관계없이 확인할 수 있어요. 시연용 혜택이며 실제 제공 여부는 매장 운영에서 결정됩니다.</p></div>'+button("길찾기 QR 보기","store");
}
const views={home,category:catalog,detail,checkout,receipt,store:storeView,help,missing:issue,payment:issue,benefit};
function render(focus=true){
  content.innerHTML=views[state.page]();
  content.scrollTop=0;
  reader.disabled=state.page!=="checkout";
  reader.classList.toggle("ready",!reader.disabled);
  const active=["store","benefit"].includes(state.page)?"store":state.page==="home"?"home":["category","detail","checkout","receipt"].includes(state.page)?"category:4":"";
  footer.innerHTML=[["home","⌂","처음"],["category:4","◇","상품 보기"],["store","↗","매장 안내"]].map(([action,icon,label])=>'<button data-action="'+action+'"'+(active===action?' class="active" aria-current="page"':'')+'><b aria-hidden="true">'+icon+'</b>'+label+'</button>').join("");
  if(focus)content.focus({preventScroll:true});
}
document.addEventListener("click",event=>{
  const trigger=event.target.closest("[data-action]");
  if(!trigger || trigger.disabled)return;
  const [action,value]=trigger.dataset.action.split(":");
  switch(action){
    case "home": state.sale=null; state.sku=null; state.page="home"; break;
    case "category": state.category=Number(value); state.page="category"; break;
    case "product": state.origin=state.page; state.sku=value; state.sale=null; state.page="detail"; break;
    case "pay":
    case "fail":
      if(state.page!=="checkout")return;
      state.sale={sku:state.sku,failed:action==="fail",id:"OB-"+Date.now().toString().slice(-8)};
      state.page="receipt";
      break;
    case "issue":
      if(state.page!=="help")state.returnTo=state.page;
      state.page=value;
      break;
    case "help":
      if(!["help","missing","payment"].includes(state.page))state.returnTo=state.page;
      state.page="help";
      break;
    case "return": state.page=state.returnTo; break;
    default: state.page=action;
  }
  render();
});
seasonControl.addEventListener("change",()=>{if(state.page==="home")render(false)});
render(false);
</script>
